<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفيق البكالوريا 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12181d;
    --surface:#1b232a;
    --surface-2:#232d35;
    --border:#324049;
    --text:#eef1ee;
    --text-muted:#8fa0a8;
    --accent:#d7a63c;
    --accent-dim:#8a6a2a;
    --accent-text:#1a1305;
    --gold:var(--accent);
    --gold-dim:var(--accent-dim);
    --green:#4f9078;
    --green-dim:#2c4a3d;
    --red:#b1493f;
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:24px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
  }

  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(215,166,60,.09) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    line-height:1.6;
  }

  h1,h2,h3,.display{
    font-family:'Tajawal', sans-serif;
  }

  .hidden{
    display:none !important;
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }

  input,textarea{
    font-family:inherit;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:11px 14px;
    font-size:15px;
    width:100%;
  }

  input:focus,
  textarea:focus,
  button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }

  .ticket{
    position:relative;
  }

  .ticket::before,
  .ticket::after{
    content:"";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--border);
  }

  .ticket::before{left:-10px;}
  .ticket::after{right:-10px;}

  .seal{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%) rotate(-6deg);
    width:74px;
    height:74px;
    border-radius:50%;
    border:2px dashed var(--gold-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--gold);
    font-family:'Tajawal',sans-serif;
  }

  .seal .yr{
    font-size:16px;
    font-weight:800;
    line-height:1;
  }

  .seal .lbl2{
    font-size:8.5px;
    color:var(--text-muted);
    margin-top:2px;
    letter-spacing:.5px;
  }

  @keyframes riseIn{
    from{
      opacity:0;
      transform:translateY(10px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  .rise-in{
    animation:riseIn .55s ease both;
  }

  /* ---------- LOGIN SCREEN ---------- */

  #screen-login{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
  }

  .brand{
    text-align:center;
    margin-bottom:28px;
  }

  .brand .kicker{
    color:var(--gold);
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
  }

  .brand h1{
    font-size:26px;
    font-weight:800;
    margin:0;
  }

  .countdown-hero{
    background:linear-gradient(
      160deg,
      var(--surface) 0%,
      var(--surface-2) 100%
    );
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:34px 22px 30px;
    width:100%;
    max-width:420px;
    text-align:center;
    margin-bottom:34px;
    overflow:visible;
  }

  .countdown-hero .exam-date{
    color:var(--text-muted);
    font-size:14px;
    margin-bottom:14px;
  }

  .countdown-big{
    font-size:64px;
    font-weight:800;
    color:var(--gold);
    line-height:1;
    font-family:'Tajawal',sans-serif;
  }

  .countdown-big span{
    font-size:20px;
    font-weight:500;
    color:var(--text-muted);
    margin-right:6px;
  }

  .countdown-sub{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:18px;
    color:var(--text-muted);
    font-size:14px;
  }

  .countdown-sub b{
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:16px;
  }

  .login-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:26px;
    width:100%;
    max-width:420px;
  }

  .login-card h2{
    font-size:18px;
    margin:0 0 4px;
  }

  .login-card p.help{
    color:var(--text-muted);
    font-size:13.5px;
    margin:0 0 18px;
  }

  .field{
    margin-bottom:14px;
  }

  .field label{
    display:block;
    font-size:13.5px;
    color:var(--text-muted);
    margin-bottom:6px;
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:18px;
  }

  .btn{
    flex:1;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    font-size:15px;
    font-weight:600;
    transition:transform .12s ease,opacity .12s ease;
  }

  .btn:active{
    transform:scale(.97);
  }

  .btn-primary{
    background:var(--accent);
    color:var(--accent-text);
  }

  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }

  .btn-danger{
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
  }

  .login-msg{
    margin-top:12px;
    font-size:13.5px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    display:none;
  }

  .login-msg.show{
    display:block;
  }

  .login-msg.err{
    background:rgba(177,73,63,.15);
    color:#e4948c;
  }

  .login-msg.ok{
    background:rgba(79,144,120,.15);
    color:#8fd4bb;
  }

  .known-users{
    margin-top:18px;
  }

  .known-users .lbl{
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:8px;
  }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .chip{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-muted);
    padding:6px 12px;
    border-radius:100px;
    font-size:13px;
  }

  .privacy-note{
    max-width:420px;
    color:var(--text-muted);
    font-size:12.5px;
    text-align:center;
    margin-top:16px;
    padding:0 8px;
  }

  /* ---------- DASHBOARD ---------- */

  #screen-dashboard{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header.topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }

  .who{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--gold-dim);
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
  }

  .who .name{
    font-weight:700;
    font-size:15px;
  }

  .who .sub{
    font-size:12px;
    color:var(--text-muted);
  }

  .topbar-actions{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .mini-countdown
<script>
/* =========================================================
   رفيق البكالوريا 2027
   JavaScript — الجزء 2/3
   ========================================================= */

(() => {
  'use strict';

  /* ---------- الثوابت ---------- */

  const EXAM_DATE = new Date('2027-06-13T08:30:00');

  const DEFAULT_SUBJECTS = [
    'الرياضيات',
    'الفيزياء',
    'العلوم الطبيعية',
    'اللغة العربية',
    'اللغة الفرنسية',
    'اللغة الإنجليزية',
    'الفلسفة',
    'التاريخ والجغرافيا',
    'التربية الإسلامية'
  ];

  const WEEKDAYS = [
    'الأحد',
    'الإثنين',
    'الثلاثاء',
    'الأربعاء',
    'الخميس',
    'الجمعة',
    'السبت'
  ];

  const MONTHS = [
    'جانفي',
    'فيفري',
    'مارس',
    'أفريل',
    'ماي',
    'جوان',
    'جويلية',
    'أوت',
    'سبتمبر',
    'أكتوبر',
    'نوفمبر',
    'ديسمبر'
  ];

  const MOTIVATIONS = [
    'خطوة صغيرة اليوم أفضل من ندم كبير غداً.',
    'لا تحتاج أن تكون مثالياً؛ تحتاج أن تستمر.',
    'كل مسألة تحلها اليوم تجعل امتحان الغد أسهل.',
    'الاستمرارية أقوى من الحماس.',
    'ساعة مركزة خير من خمس ساعات مشتتة.',
    'لا تقارن بدايتك بمنتصف طريق شخص آخر.',
    'البكالوريا تُبنى يوماً بعد يوم.',
    'إذا كان الطريق طويلاً، فابدأ بالخطوة التالية فقط.',
    'افهم، ثم طبّق، ثم راجع.',
    'هدفك ليس أن تدرس كثيراً؛ هدفك أن تتقدم.'
  ];

  const ACCENTS = [
    '#d7a63c',
    '#5da9a0',
    '#6f9bc8',
    '#9c7ac2',
    '#c77777',
    '#7ea86b',
    '#d48a4d'
  ];

  /* ---------- حالة التطبيق ---------- */

  let state = {
    profile: null,
    profileKey: null,
    selectedDate: dateKey(new Date())
  };

  let memoryStorage = {};
  let storageMode = 'memory';
  let saveTimer = null;

  /* ---------- عناصر DOM ---------- */

  const $ = id => document.getElementById(id);

  const loginScreen = $('screen-login');
  const dashboardScreen = $('screen-dashboard');

  /* ---------- أدوات عامة ---------- */

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function dateKey(date) {
    const d = new Date(date);

    return [
      d.getFullYear(),
      pad(d.getMonth() + 1),
      pad(d.getDate())
    ].join('-');
  }

  function parseDate(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function startOfDay(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function addDays(date, amount) {
    const d = new Date(date);
    d.setDate(d.getDate() + amount);
    return d;
  }

  function daysBetween(a, b) {
    const aa = startOfDay(a).getTime();
    const bb = startOfDay(b).getTime();

    return Math.round((bb - aa) / 86400000);
  }

  function escapeHTML(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function showMessage(text, type = 'ok') {
    const box = $('login-msg');

    if (!box) return;

    box.textContent = text;
    box.className = `login-msg show ${type}`;

    clearTimeout(showMessage.timer);

    showMessage.timer = setTimeout(() => {
      box.className = 'login-msg';
    }, 3500);
  }

  function initials(name) {
    const clean = String(name || '').trim();

    if (!clean) return '؟';

    const chars = [...clean];

    if (chars.length === 1) return chars[0];

    return chars.slice(0, 2).join('');
  }

  function formatDateArabic(key) {
    const d = parseDate(key);

    return {
      day: d.getDate(),
      month: MONTHS[d.getMonth()],
      year: d.getFullYear(),
      weekday: WEEKDAYS[d.getDay()]
    };
  }

  /* ---------- التخزين ---------- */

  /*
    الأولوية:
    1. window.storage إن كان متاحاً.
    2. localStorage في المتصفح العادي.
    3. ذاكرة مؤقتة كحل أخير.
  */

  const hasWindowStorage =
    typeof window !== 'undefined' &&
    window.storage &&
    typeof window.storage.get === 'function' &&
    typeof window.storage.set === 'function';

  let localStorageAvailable = false;

  try {
    const testKey = '__bac_storage_test__';

    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);

    localStorageAvailable = true;
  } catch (e) {
    localStorageAvailable = false;
  }

  if (hasWindowStorage) {
    storageMode = 'window';
  } else if (localStorageAvailable) {
    storageMode = 'local';
  } else {
    storageMode = 'memory';
  }

  async function storageGet(key) {
    try {
      if (storageMode === 'window') {
        const result = await window.storage.get(key);

        if (!result) return null;

        if (typeof result === 'string') {
          return result;
        }

        if ('value' in result) {
          return result.value;
        }

        return null;
      }

      if (storageMode === 'local') {
        return localStorage.getItem(key);
      }

      return memoryStorage[key] ?? null;

    } catch (error) {
      console.warn('Storage get error:', error);

      try {
        return localStorage.getItem(key);
      } catch (e) {
        return memoryStorage[key] ?? null;
      }
    }
  }

  async function storageSet(key, value) {
    try {
      if (storageMode === 'window') {
        await window.storage.set(key, value);
        return true;
      }

      if (storageMode === 'local') {
        localStorage.setItem(key, value);
        return true;
      }

      memoryStorage[key] = value;
      return true;

    } catch (error) {
      console.warn('Storage set error:', error);

      try {
        localStorage.setItem(key, value);
        return true;
      } catch (e) {
        memoryStorage[key] = value;
        return false;
      }
    }
  }

  async function storageDelete(key) {
    try {
      if (storageMode === 'window') {
        if (typeof window.storage.delete === 'function') {
          await window.storage.delete(key);
        }
        return true;
      }

      if (storageMode === 'local') {
        localStorage.removeItem(key);
        return true;
      }

      delete memoryStorage[key];
      return true;

    } catch (error) {
      try {
        localStorage.removeItem(key);
      } catch (e) {}

      delete memoryStorage[key];

      return false;
    }
  }

  /* ---------- حماية مفتاح الحساب ---------- */

  /*
    لا نخزّن PIN نفسه داخل اسم المفتاح.
    هذه ليست حماية أمنية كاملة، لكنها أفضل من:
    username_pin
  */

  function simpleHash(text) {
    let hash = 2166136261;

    for (let i = 0; i < text.length; i++) {
      hash ^= text.charCodeAt(i);
      hash +=
        (hash << 1) +
        (hash << 4) +
        (hash << 7) +
        (hash << 8) +
        (hash << 24);
    }

    return (hash >>> 0).toString(16);
  }

  function normalizeUsername(username) {
    return String(username || '')
      .trim()
      .toLowerCase()
      .replace(/\s+/g, '_');
  }

  function makeProfileKey(username, pin) {
    const normalized = normalizeUsername(username);

    return `bac2027_${simpleHash(
      `${normalized}|${pin}|bac2027`
    )}`;
  }

  /* ---------- بنية الحساب ---------- */

  function createProfile(username) {
    const today = dateKey(new Date());

    return {
      version: 2,

      username,

      createdAt: today,

      school: '',

      subjects: [...DEFAULT_SUBJECTS],

      accent: ACCENTS[0],

      background: '',

      reminder: '',

      entries: {},

      settings: {
        lastSaved: null
      }
    };
  }

  function normalizeProfile(profile, username) {
    const p = profile && typeof profile === 'object'
      ? profile
      : createProfile(username);

    p.version = 2;
    p.username = p.username || username;
    p.createdAt = p.createdAt || dateKey(new Date());

    if (!Array.isArray(p.subjects) || !p.subjects.length) {
      p.subjects = [...DEFAULT_SUBJECTS];
    }

    p.subjects = [...new Set(
      p.subjects
        .map(s => String(s).trim())
        .filter(Boolean)
    )];

    if (!p.entries || typeof p.entries !== 'object') {
      p.entries = {};
    }

    p.school = String(p.school || '');
    p.accent = p.accent || ACCENTS[0];
    p.background = p.background || '';
    p.reminder = p.reminder || '';

    if (!p.settings || typeof p.settings !== 'object') {
      p.settings = {};
    }

    return p;
  }

  function createDailyEntry(key) {
    const tasks = state.profile.subjects.map(subject => ({
      id: createTaskId(),
      text: `مراجعة ${subject}`,
      subject,
      done: false,
      system: true
    }));

    return {
      date: key,
      tasks,
      journal: '',
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
  }

  function getEntry(key) {
    if (!state.profile.entries[key]) {
      state.profile.entries[key] = createDailyEntry(key);
    }

    const entry = state.profile.entries[key];

    if (!Array.isArray(entry.tasks)) {
      entry.tasks = [];
    }

    if (typeof entry.journal !== 'string') {
      entry.journal = '';
    }

    return entry;
  }

  function createTaskId() {
    return (
      Date.now().toString(36) +
      Math.random().toString(36).slice(2, 8)
    );
  }

  /* ---------- التحقق من التواريخ ---------- */

  function getStartDate() {
    return parseDate(state.profile.createdAt);
  }

  function getToday() {
    return startOfDay(new Date());
  }

  function getExamDay() {
    return startOfDay(EXAM_DATE);
  }

  function isBeforeStart(key) {
    return parseDate(key) < getStartDate();
  }

  function isAfterExam(key) {
    return parseDate(key) > getExamDay();
  }

  function isToday(key) {
    return key === dateKey(new Date());
  }

  /* ---------- حفظ الحساب ---------- */

  async function saveProfile(showStatus = false) {
    if (!state.profile || !state.profileKey) {
      return false;
    }

    state.profile.settings.lastSaved = Date.now();

    const ok = await storageSet(
      state.profileKey,
      JSON.stringify(state.profile)
    );

    if (showStatus) {
      const status = $('save-status');

      if (status) {
        status.textContent = ok
          ? 'تم الحفظ ✓'
          : 'تعذر الحفظ';

        status.classList.add('show');

        clearTimeout(status.timer);

        status.timer = setTimeout(() => {
          status.classList.remove('show');
        }, 2200);
      }
    }

    return ok;
  }

  function autoSave(delay = 350) {
    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
      saveProfile(false);
    }, delay);
  }

  /* ---------- الدخول ---------- */

  async function login() {
    const usernameInput = $('in-username');
    const pinInput = $('in-pin');

    const username = String(
      usernameInput?.value || ''
    ).trim();

    const pin = String(
      pinInput?.value || ''
    ).trim();

    if (username.length < 2) {
      showMessage(
        'اكتب اسم مستخدم مكوّناً من حرفين على الأقل.',
        'err'
      );

      usernameInput?.focus();
      return;
    }

    if (!/^\d{4}$/.test(pin)) {
      showMessage(
        'رمز الدخول يجب أن يتكون من 4 أرقام بالضبط.',
        'err'
      );

      pinInput?.focus();
      return;
    }

    const profileKey = makeProfileKey(username, pin);

    let raw = await storageGet(profileKey);

    let profile;

    if (raw) {
      try {
        profile = normalizeProfile(
          JSON.parse(raw),
          username
        );
      } catch (error) {
        console.error(error);

        showMessage(
          'تعذر قراءة بيانات الحساب. قد تكون البيانات تالفة.',
          'err'
        );

        return;
      }
    } else {
      profile = createProfile(username);

      await storageSet(
        profileKey,
        JSON.stringify(profile)
      );

      showMessage(
        'تم إنشاء حسابك بنجاح.',
        'ok'
      );
    }

    state.profile = profile;
    state.profileKey = profileKey;

    const todayKey = dateKey(new Date());

    if (
      isBeforeStart(todayKey) ||
      isAfterExam(todayKey)
    ) {
      state.selectedDate = profile.createdAt;
    } else {
      state.selectedDate = todayKey;
    }

    applyProfileAppearance();

    loginScreen.classList.add('hidden');
    dashboardScreen.classList.remove('hidden');

    renderDashboard();

    autoSave();
  }

  function logout() {
    clearTimeout(saveTimer);

    state.profile = null;
    state.profileKey = null;

    dashboardScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');

    if ($('in-pin')) {
      $('in-pin').value = '';
    }

    if ($('in-username')) {
      $('in-username').focus();
    }

    updateKnownUsers();
  }

  /* ---------- الحسابات المعروفة ---------- */

  async function updateKnownUsers() {
    /*
      localStorage لا يسمح لنا بسهولة بالحصول على مفاتيح
      window.storage، لذلك هذه القائمة تظهر فقط في localStorage.
    */

    const wrap = $('known-users-wrap');
    const list = $('known-users-list');

    if (!wrap || !list) return;

    list.innerHTML = '';

    if (storageMode !== 'local') {
      wrap.style.display = 'none';
      return;
    }

    const users = [];

    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);

        if (!key || !key.startsWith('bac2027_')) {
          continue;
        }

        const raw = localStorage.getItem(key);

        try {
          const profile = JSON.parse(raw);

          if (profile?.username) {
            users.push(profile.username);
          }
        } catch (e) {}
      }
    } catch (error) {
      return;
    }

    const uniqueUsers = [...new Set(users)];

    if (!uniqueUsers.length) {
      wrap.style.display = 'none';
      return;
    }

    wrap.style.display = 'block';

    uniqueUsers.forEach(username => {
      const button = document.createElement('button');

      button.className = 'chip';
      button.type = 'button';
      button.textContent = username;

      button.addEventListener('click', () => {
        $('in-username').value = username;
        $('in-pin').focus();
      });

      list.appendChild(button);
    });
  }

  /* ---------- العد التنازلي ---------- */

  function updateCountdown() {
    const now = new Date();

    let diff = EXAM_DATE.getTime() - now.getTime();

    if (diff < 0) {
      diff = 0;
    }

    const totalSeconds = Math.floor(diff / 1000);

    const days = Math.floor(totalSeconds / 86400);

    const hours = Math.floor(
      (totalSeconds % 86400) / 3600
    );

    const minutes = Math.floor(
      (totalSeconds % 3600) / 60
    );

    const seconds = totalSeconds % 60;

    const daysEl = $('cd-days');

    if (daysEl) {
      daysEl.innerHTML =
        `${days}<span>يوم</span>`;
    }

    if ($('cd-hours')) {
      $('cd-hours').textContent = pad(hours);
    }

    if ($('cd-mins')) {
      $('cd-mins').textContent = pad(minutes);
    }

    if ($('cd-secs')) {
      $('cd-secs').textContent = pad(seconds);
    }

    if ($('mini-days')) {
      $('mini-days').textContent = days;
    }
  }

  /* ---------- التنقل بين التبويبات ---------- */

  function openTab(tabName) {
    document
      .querySelectorAll('.tab-btn')
      .forEach(button => {
        button.classList.toggle(
          'active',
          button.dataset.tab === tabName
        );
      });

    document
      .querySelectorAll('.tab-panel')
      .forEach(panel => {
        panel.classList.toggle(
          'hidden',
          panel.id !== `tab-${tabName}`
        );
      });

    if (tabName === 'today') {
      renderToday();
    }

    if (tabName === 'calendar') {
      renderCalendar();
    }

    if (tabName === 'stats') {
      renderStats();
    }

    if (tabName === 'settings') {
      renderSettings();
    }
  }

  /* ---------- عرض لوحة التحكم ---------- */

  function renderDashboard() {
    if (!state.profile) return;

    $('dash-name').textContent =
      state.profile.username;

    $('dash-avatar').textContent =
      initials(state.profile.username);

    renderToday();
  }

  /* ---------- اليوم ---------- */

  function renderToday() {
    if (!state.profile) return;

    let key = state.selectedDate;

    if (isBeforeStart(key)) {
      key = state.profile.createdAt;
      state.selectedDate = key;
    }

    if (isAfterExam(key)) {
      key = dateKey(EXAM_DATE);
      state.selectedDate = key;
    }

    const info = formatDateArabic(key);

    $('date-d1').textContent =
      `${info.weekday}، ${info.day} ${info.month}`;

    $('date-d2').textContent =
      info.year === 2027
        ? 'السنة الدراسية 2026–2027'
        : `السنة ${info.year}`;

    const prev = $('date-prev');
    const next = $('date-next');

    if (prev) {
      prev.disabled =
        parseDate(key) <= getStartDate();
    }

    if (next) {
      next.disabled =
        parseDate(key) >= getExamDay();
    }

    const entry = getEntry(key);

    renderTasks(entry);
    renderJournal(entry);
    renderNudge(entry);
    renderDailyQuote(key);

    applyProfileAppearance();
  }

  function renderTasks(entry) {
    const list = $('task-list');

    if (!list) return;

    list.innerHTML = '';

    if (!entry.tasks.length) {
      const empty = document.createElement('li');

      empty.style.cssText = `
        color:var(--text-muted);
        background:var(--surface);
        border:1px dashed var(--border);
        border-radius:var(--radius-sm);
        padding:18px;
        text-align:center;
        font-size:13px;
      `;

      empty.textContent =
        'لا توجد مهام لهذا اليوم. أضف مهمتك الأولى.';

      list.appendChild(empty);

      return;
    }

    entry.tasks.forEach(task => {
      const li = document.createElement('li');

      li.className =
        `task-item${task.done ? ' done' : ''}`;

      const check = document.createElement('button');

      check.className = 'check';
      check.type = 'button';
      check.setAttribute(
        'aria-label',
        task.done
          ? 'إلغاء إنجاز المهمة'
          : 'إنجاز المهمة'
      );

      check.textContent = task.done ? '✓' : '';

      check.addEventListener('click', () => {
        task.done = !task.done;
        entry.updatedAt = Date.now();

        renderTasks(entry);
        renderNudge(entry);

        autoSave();
      });

      const label = document.createElement('div');

      label.className = 'label';
      label.textContent = task.text;

      if (task.subject) {
        const subject = document.createElement('small');

        subject.textContent = ` · ${task.subject}`;

        subject.style.cssText = `
          color:var(--text-muted);
          font-size:11px;
        `;

        label.appendChild(subject);
      }

      const remove = document.createElement('button');

      remove.className = 'remove';
      remove.type = 'button';
      remove.textContent = 'حذف';

      remove.addEventListener('click', () => {
        const confirmed = confirm(
          'هل تريد حذف هذه المهمة؟'
        );

        if (!confirmed) return;

        entry.tasks =
          entry.tasks.filter(t => t.id !== task.id);

        entry.updatedAt = Date.now();

        renderTasks(entry);
        renderNudge(entry);

        autoSave();
      });

      li.appendChild(check);
      li.appendChild(label);
      li.appendChild(remove);

      list.appendChild(li);
    });
  }

  function renderJournal(entry) {
    const textarea = $('journal-text');

    if (!textarea) return;

    textarea.value = entry.journal || '';

    textarea.oninput = () => {
      entry.journal = textarea.value;
      entry.updatedAt = Date.now();

      autoSave(600);
    };
  }

  function renderNudge(entry) {
    const banner = $('nudge-banner');

    if (!banner) return;

    const hasDone =
      entry.tasks.some(task => task.done);

    const hasJournal =
      String(entry.journal || '').trim().length > 0;

    const shouldShow =
      isToday(state.selectedDate) &&
      !hasDone &&
      !hasJournal;

    banner.classList.toggle(
      'hidden',
      !shouldShow
    );
  }

  function renderDailyQuote(key) {
    const el = $('daily-quote');

    if (!el) return;

    const d = parseDate(key);

    const index =
      Math.abs(
        Math.floor(d.getTime() / 86400000)
      ) % MOTIVATIONS.length;

    el.textContent =
      `« ${MOTIVATIONS[index]} »`;
  }

  /* ---------- إضافة مهمة ---------- */

  function addTask() {
    const input = $('new-task-input');

    if (!input) return;

    const text = input.value.trim();

    if (!text) {
      input.focus();
      return;
    }

    const entry = getEntry(state.selectedDate);

    entry.tasks.push({
      id: createTaskId(),
      text,
      subject: '',
      done: false,
      system: false
    });

    entry.updatedAt = Date.now();

    input.value = '';

    renderTasks(entry);
    renderNudge(entry);

    autoSave();

    input.focus();
  }

  /* ---------- التنقل بين الأيام ---------- */

  function changeDate(amount) {
    const current = parseDate(state.selectedDate);

    const next = addDays(current, amount);

    if (next < getStartDate()) {
      return;
    }

    if (next > getExamDay()) {
      return;
    }

    state.selectedDate = dateKey(next);

    renderToday();
  }

  function goToday() {
    const today = getToday();

    if (
      today >= getStartDate() &&
      today <= getExamDay()
    ) {
      state.selectedDate = dateKey(today);
      renderToday();
    }
  }

  /* ---------- التقويم ---------- */

  function renderCalendar() {
    const container = $('calendar-container');

    if (!container || !state.profile) return;

    container.innerHTML = '';

    const start = getStartDate();
    const exam = getExamDay();

    let cursor = new Date(
      start.getFullYear(),
      start.getMonth(),
      1
    );

    while (cursor <= exam) {
      const year = cursor.getFullYear();
      const month = cursor.getMonth();

      const block = document.createElement('div');

      block.className = 'month-block';

      const title = document.createElement('h3');

      title.textContent =
        `${MONTHS[month]} ${year}`;

      block.appendChild(title);

      const grid = document.createElement('div');

      grid.className = 'cal-grid';

      WEEKDAYS.forEach(day => {
        const head = document.createElement('div');

        head.className = 'cal-head';
        head.textContent = day.slice(0, 2);

        grid.appendChild(head);
      });

      const firstDay =
        new Date(year, month, 1).getDay();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');

        empty.className =
          'cal-cell empty';

        grid.appendChild(empty);
      }

      const daysInMonth =
        new Date(year, month + 1, 0).getDate();

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);

        if (date < start || date > exam) {
          const empty = document.createElement('div');

          empty.className =
            'cal-cell empty';

          grid.appendChild(empty);

          continue;
        }

        const key = dateKey(date);

        const cell = document.createElement('button');

        cell.type = 'button';
        cell.className = 'cal-cell';

        cell.textContent = day;

        const entry =
          state.profile.entries[key];

        const active =
          !!entry &&
          (
            entry.tasks?.some(t => t.done) ||
            String(entry.journal || '').trim()
          );

        if (active) {
          cell.classList.add('active-day');
        }

        if (isToday(key)) {
          cell.classList.add('today');
        }

        if (key === dateKey(EXAM_DATE)) {
          cell.classList.add('exam-day');
        }

        if (
          date < getToday() &&
          !active
        ) {
          cell.classList.add('missed');
        }

        cell.addEventListener('click', () => {
          state.selectedDate = key;

          openTab('today');
        });

        grid.appendChild(cell);
      }

      block.appendChild(grid);
      container.appendChild(block);

      cursor =
        new Date(year, month + 1, 1);
    }
  }

  /* ---------- الإحصائيات ---------- */

  function getAllDates() {
    const dates = [];

    const start = getStartDate();
    const today = getToday();

    const end =
      today < getExamDay()
        ? today
        : getExamDay();

    if (end < start) {
      return dates;
    }

    let cursor = new Date(start);

    while (cursor <= end) {
      dates.push(dateKey(cursor));
      cursor = addDays(cursor, 1);
    }

    return dates;
  }

  function isActiveDate(key) {
    const entry =
      state.profile.entries[key];

    if (!entry) return false;

    return (
      entry.tasks?.some(task => task.done) ||
      String(entry.journal || '').trim().length > 0
    );
  }

  function getCompletedTasks() {
    let count = 0;

    Object.values(
      state.profile.entries
    ).forEach(entry => {
      if (!Array.isArray(entry.tasks)) return;

      count += entry.tasks.filter(
        task => task.done
      ).length;
    });

    return count;
  }

  function getLongestStreak() {
    let longest = 0;
    let current = 0;

    getAllDates().forEach(key => {
      if (isActiveDate(key)) {
        current++;
        longest = Math.max(longest, current);
      } else {
        current = 0;
      }
    });

    return longest;
  }

  function getCurrentStreak() {
    const todayKey = dateKey(new Date());

    let cursor = parseDate(todayKey);

    if (!isActiveDate(todayKey)) {
      cursor = addDays(cursor, -1);
    }

    let streak = 0;

    while (cursor >= getStartDate()) {
      const key = dateKey(cursor);

      if (!isActiveDate(key)) {
        break;
      }

      streak++;
      cursor = addDays(cursor, -1);
    }

    return streak;
  }

  function getMissedDays() {
    return getAllDates()
      .filter(key =>
        parseDate(key) < getToday()
      )
      .filter(key => !isActiveDate(key))
      .length;
  }

  function renderStats() {
    if (!state.profile) return;

    const allDates = getAllDates();

    const activeDays =
      allDates.filter(isActiveDate).length;

    const totalDays =
      Math.max(allDates.length, 1);

    const percent =
      Math.round(
        (activeDays / totalDays) * 100
      );

    const completedTasks =
      getCompletedTasks();

    const currentStreak =
      getCurrentStreak();

    const longestStreak =
      getLongestStreak();

    const missed =
      getMissedDays();

    $('progress-percent').textContent =
      `${percent}%`;

    $('stat-active').textContent =
      activeDays;

    $('stat-tasks').textContent =
      completedTasks;

    $('stat-streak').textContent =
      longestStreak;

    $('stat-missed').textContent =
      missed;

    renderProgressRing(percent);
    renderActivityChart();
    renderSubjectStats();
  }

  function renderProgressRing(percent) {
    const container =
      $('progress-ring');

    if (!container) return;

    const radius = 28;
    const circumference =
      2 * Math.PI * radius;

    const offset =
      circumference -
      (percent / 100) * circumference;

    container.innerHTML = `
      <svg
        width="76"
        height="76"
        viewBox="0 0 76 76"
        aria-label="نسبة التقدم ${percent}%"
      >
        <circle
          cx="38"
          cy="38"
          r="${radius}"
          fill="none"
          stroke="var(--surface-2)"
          stroke-width="7"
        ></circle>

        <circle
          cx="38"
          cy="38"
          r="${radius}"
          fill="none"
          stroke="var(--gold)"
          stroke-width="7"
          stroke-linecap="round"
          stroke-dasharray="${circumference}"
          stroke-dashoffset="${offset}"
          transform="rotate(-90 38 38)"
        ></circle>

        <text
          x="38"
          y="42"
          text-anchor="middle"
          fill="var(--text)"
          font-size="14"
          font-family="Tajawal"
          font-weight="800"
        >${percent}</text>
      </svg>
    `;
  }

  function renderActivityChart() {
    const chart =
      $('activity-chart');

    if (!chart) return;

    chart.innerHTML = '';

    const today =
      getToday();

    const days = [];

    for (let i = 13; i >= 0; i--) {
      const date =
        addDays(today, -i);

      const key =
        dateKey(date);

      const entry =
        state.profile.entries[key];

      const done =
        entry?.tasks?.filter(
          task => task.done
        ).length || 0;

      days.push({
        key,
        done
      });
    }

    const max =
      Math.max(
        ...days.map(d => d.done),
        1
      );

    days.forEach(item => {
      const col =
        document.createElement('div');

      col.className =
        'bar-col';

      if (isToday(item.key)) {
        col.classList.add('today');
      }

      const bar =
        document.createElement('div');

      bar.className = 'bar';

      const height =
        Math.max(
          3,
          Math.round(
            (item.done / max) * 72
          )
        );

      bar.style.height =
        `${height}px`;

      bar.title =
        `${item.done} مهمة منجزة`;

      const day =
        document.createElement('div');

      day.className =
        'bar-day';

      day.textContent =
        parseDate(item.key).getDate();

      col.appendChild(bar);
      col.appendChild(day);

      chart.appendChild(col);
    });
  }

  function renderSubjectStats() {
    const container =
      $('subject-stats');

    if (!container) return;

    container.innerHTML = '';

    const subjects =
      state.profile.subjects;

    const totals = {};

    subjects.forEach(subject => {
      totals[subject] = {
        total: 0,
        done: 0
      };
    });

    Object.values(
      state.profile.entries
    ).forEach(entry => {
      if (!Array.isArray(entry.tasks)) return;

      entry.tasks.forEach(task => {
        const subject =
          task.subject;

        if (!subject) return;

        if (!totals[subject]) {
          totals[subject] = {
            total: 0,
            done: 0
          };
        }

        totals[subject].total++;

        if (task.done) {
          totals[subject].done++;
        }
      });
    });

    subjects.forEach(subject => {
      const data =
        totals[subject];

      const percent =
        data.total
          ? Math.round(
              (data.done / data.total) * 100
            )
          : 0;

      const row =
        document.createElement('div');

      row.className =
        'subj-row';

      row.innerHTML = `
        <div class="subj-top">
          <span>${escapeHTML(subject)}</span>
          <span class="pct">${percent}%</span>
        </div>

        <div class="subj-track">
          <div
            class="subj-fill"
            style="width:${percent}%"
          ></div>
        </div>
      `;

      container.appendChild(row);
    });
  }

  /* ---------- الإعدادات ---------- */

  function renderSettings() {
    if (!state.profile) return;

    const school =
      $('school-name');

    if (school) {
      school.value =
        state.profile.school || '';

      school.oninput = () => {
        state.profile.school =
          school.value;

        autoSave();
      };
    }

    const reminder =
      $('reminder-note');

    if (reminder) {
      reminder.value =
        state.profile.reminder || '';

      reminder.oninput = () => {
        state.profile.reminder =
          reminder.value;

        autoSave();
      };
    }

    renderSubjects();
    renderAccents();
  }

  function renderSubjects() {
    const list =
      $('subjects-list');

    if (!list) return;

    list.innerHTML = '';

    state.profile.subjects.forEach(
      (subject, index) => {

        const row =
          document.createElement('div');

        row.className =
          'subject-row';

        const name =
          document.createElement('span');

        name.textContent =
          subject;

        const remove =
          document.createElement('button');

        remove.type = 'button';
        remove.textContent = 'حذف';

        remove.addEventListener(
          'click',
          () => {

            if (
              state.profile.subjects.length <= 1
            ) {
              alert(
                'يجب أن تبقى مادة واحدة على الأقل.'
              );

              return;
            }

            const confirmed =
              confirm(
                `هل تريد حذف مادة «${subject}»؟`
              );

            if (!confirmed) return;

            state.profile.subjects.splice(
              index,
              1
            );

            renderSubjects();

            /*
              لا نحذف المهام القديمة المرتبطة
              بالمادة حتى لا نخسر سجل المستخدم.
            */

            autoSave();
            renderToday();
          }
        );

        row.appendChild(name);
        row.appendChild(remove);

        list.appendChild(row);
      }
    );
  }

  function addSubject() {
    const input =
      $('new-subject-input');

    if (!input) return;

    const subject =
      input.value.trim();

    if (!subject) {
      input.focus();
      return;
    }

    const exists =
      state.profile.subjects.some(
        s =>
          s.toLowerCase() ===
          subject.toLowerCase()
      );

    if (exists) {
      alert(
        'هذه المادة موجودة بالفعل.'
      );

      input.select();
      return;
    }

    state.profile.subjects.push(subject);

    input.value = '';

    /*
      إضافة مهمة للمادة في اليوم الحالي
      حتى تظهر مباشرة للمستخدم.
    */

    const entry =
      getEntry(state.selectedDate);

    const alreadyHas =
      entry.tasks.some(
        task =>
          task.subject === subject &&
          task.system
      );

    if (!alreadyHas) {
      entry.tasks.push({
        id: createTaskId(),
        text: `مراجعة ${subject}`,
        subject,
        done: false,
        system: true
      });

      entry.updatedAt = Date.now();
    }

    renderSubjects();
    renderToday();

    autoSave();

    input.focus();
  }

  function renderAccents() {
    const container =
      $('accent-swatches');

    if (!container) return;

    container.innerHTML = '';

    ACCENTS.forEach(color => {
      const swatch =
        document.createElement('button');

      swatch.type = 'button';
      swatch.className = 'swatch';

      if (
        state.profile.accent === color
      ) {
        swatch.classList.add('selected');
      }

      swatch.style.background =
        color;

      swatch.setAttribute(
        'aria-label',
        `اختيار اللون ${color}`
      );

      swatch.addEventListener(
        'click',
        () => {

          state.profile.accent =
            color;

          applyProfileAppearance();
          renderAccents();

          autoSave();
        }
      );

      container.appendChild(swatch);
    });
  }

  /* ---------- المظهر ---------- */

  function applyProfileAppearance() {
    if (!state.profile) return;

    const root =
      document.documentElement;

    const accent =
      state.profile.accent ||
      ACCENTS[0];

    root.style.setProperty(
      '--accent',
      accent
    );

    /*
      حساب لون accent-dim بطريقة بسيطة.
    */

    root.style.setProperty(
      '--accent-dim',
      hexToRgba(accent, .42)
    );

    const bg =
      state.profile.background;

    if (bg) {
      document.body.style.backgroundImage =
        `
          linear-gradient(
            rgba(10,14,17,.72),
            rgba(10,14,17,.72)
          ),
          url("${bg}")
        `;

      document.body.style.backgroundSize =
        'cover';

      document.body.style.backgroundAttachment =
        'fixed';

      document.body.style.backgroundPosition =
        'center';

    } else {
      document.body.style.backgroundImage =
        `
          radial-gradient(
            circle at 1px 1px,
            rgba(215,166,60,.09) 1px,
            transparent 0
          )
        `;

      document.body.style.backgroundSize =
        '22px 22px';

      document.body.style.backgroundAttachment =
        'initial';
    }
  }

  function hexToRgba(hex, alpha) {
    const value =
      String(hex)
        .replace('#', '')
        .trim();

    if (value.length !== 6) {
      return hex;
    }

    const r =
      parseInt(value.slice(0, 2), 16);

    const g =
      parseInt(value.slice(2, 4), 16);

    const b =
      parseInt(value.slice(4, 6), 16);

    return `rgba(${r},${g},${b},${alpha})`;
  }

  /* ---------- ضغط الصورة قبل التخزين ---------- */

  function compressImage(file) {
    return new Promise((resolve, reject) => {

      if (!file) {
        reject(
          new Error('No file')
        );

        return;
      }

      const reader =
        new FileReader();

      reader.onload = () => {

        const img =
          new Image();

        img.onload = () => {

          const maxSize = 1600;

          let width =
            img.naturalWidth;

          let height =
            img.naturalHeight;

          if (
            width > maxSize ||
            height > maxSize
          ) {
            const ratio =
              Math.min(
                maxSize / width,
                maxSize / height
              );

            width =
              Math.round(width * ratio);

            height =
              Math.round(height * ratio);
          }

          const canvas =
            document.createElement('canvas');

          canvas.width =
            width;

          canvas.height =
            height;

          const ctx =
            canvas.getContext('2d');

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          const result =
            canvas.toDataURL(
              'image/jpeg',
              .75
            );

          resolve(result);
        };

        img.onerror =
          () => reject(
            new Error(
              'تعذر قراءة الصورة'
            )
          );

        img.src =
          reader.result;
      };

      reader.onerror =
        () => reject(
          new Error(
            'تعذر قراءة الملف'
          )
        );

      reader.readAsDataURL(file);
    });
  }

  async function handleBackground(file) {
    if (!file) return;

    if (!file.type.startsWith('image/')) {

  function exportData() {
    if (!state.profile) return;

    const backup = {
      app: 'رفيق البكالوريا 2027',
      version: 2,
      exportedAt: new Date().toISOString(),
      profile: state.profile
    };

    const blob =
      new Blob(
        [JSON.stringify(
          backup,
          null,
          2
        )],
        {
          type:'application/json'
        }
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement('a');

    const safeName =
      String(
        state.profile.username

      .replace(

        '_'

    a.download =
      `bac2027_${safeName}_backup.json`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(() => {
      URL.revokeObjectURL(url);

  async function importData(file) {
    if (!file) return;

    try {
      const text =
        await file.text();

      const backup =
        JSON.parse(text);

      const imported =
        backup.profile || backup;

      if (
        !imported ||
        typeof imported !== 'object' ||
        !Array.isArray(imported.subjects) ||
        !imported.entries
      ) {
        throw new Error(
          'Invalid backup'
        );

        confirm(
          'سيتم استبدال بيانات الحساب الحالية بالنسخة المستوردة. هل تريد المتابعة؟'
        );

      if (!confirmed) return;

      state.profile =
        normalizeProfile(
          imported,

        );

      await saveProfile(true);

      applyProfileAppearance();
      renderDashboard();

  function renderCalendar(){
    var container =
      document.getElementById("calendar-container");

    container.innerHTML = "";

    var start = accountStartMidnight();
    var today = todayMidnight();

    var end = new Date(EXAM_DATE);
    end.setHours(0,0,0,0);

    var cursor = new Date(
      start.getFullYear(),
      start.getMonth(),
      1
    );

    while(cursor <= end){

      var monthBlock =
        document.createElement("div");

      monthBlock.className = "month-block";

      var h3 = document.createElement("h3");

      h3.textContent =
        MONTHS[cursor.getMonth()] +
        " " +
        cursor.getFullYear();

      monthBlock.appendChild(h3);

      var grid =
        document.createElement("div");

      grid.className = "cal-grid";

      WEEKDAYS.forEach(function(w){
        var hd =
          document.createElement("div");

        hd.className = "cal-head";
        hd.textContent = w;

        grid.appendChild(hd);
      });

      var firstOfMonth =
        new Date(
          cursor.getFullYear(),
          cursor.getMonth(),
          1
        );

      var leadBlanks =
        firstOfMonth.getDay();

      for(var b = 0; b < leadBlanks; b++){
        var blank =
          document.createElement("div");

        blank.className =
          "cal-cell empty";

        grid.appendChild(blank);
      }

      var daysInMonth =
        new Date(
          cursor.getFullYear(),
          cursor.getMonth()+1,
          0
        ).getDate();

      for(
        var day = 1;
        day <= daysInMonth;
        day++
      ){

        var d =
          new Date(
            cursor.getFullYear(),
            cursor.getMonth(),
            day
          );

        var cell =
          document.createElement("div");

        cell.textContent = day;
        cell.className = "cal-cell";

        if(d < start || d > end){

          cell.classList.add("empty");
          cell.textContent = "";

        }else{

          var k = dateKey(d);
          var entry = state.profile.entries[k];

          var hasActivity =
            entry &&
            (
              entry.note ||
              entry.tasks.some(function(t){
                return t.done;
              })
            );

          if(sameDay(d, end)){
            cell.classList.add("exam-day");

          }else if(hasActivity){
            cell.classList.add("active-day");

          }else if(d < today){
            cell.classList.add("missed");

          }else{
            cell.classList.add("future");
          }

          if(sameDay(d, today)){
            cell.classList.add("today");
          }

          cell.addEventListener(
            "click",
            function(dateClicked){
              return function(){

                state.selectedDate =
                  dateClicked;

                switchTab("today");
                renderToday();

              };
            }(d)
          );
        }

        grid.appendChild(cell);
      }

      monthBlock.appendChild(grid);
      container.appendChild(monthBlock);

      cursor.setMonth(
        cursor.getMonth() + 1
      );
    }
  }

  function renderStats(){

    var start = accountStartMidnight();
    var today = todayMidnight();

    var end = new Date(EXAM_DATE);
    end.setHours(0,0,0,0);

    var remaining =
      Math.round(
        (end - today) / 86400000
      );

    var entries =
      state.profile.entries;

    var activeDays = 0;
    var totalDoneTasks = 0;
    var activeDateKeys = [];

    Object.keys(entries).forEach(function(k){

      var e = entries[k];

      var doneCount =
        e.tasks.filter(function(t){
          return t.done;
        }).length;

      totalDoneTasks += doneCount;

      if(
        e.note ||
        doneCount > 0
      ){

        activeDays++;
        activeDateKeys.push(k);
      }
    });

    activeDateKeys.sort();

    var longest = 0;
    var current = 0;
    var prevDate = null;

    activeDateKeys.forEach(function(k){

      var parts = k.split("-");

      var d =
        new Date(
          +parts[0],
          +parts[1]-1,
          +parts[2]
        );

      if(prevDate){

        var diffDays =
          Math.round(
            (d - prevDate) / 86400000
          );

        current =
          diffDays === 1
            ? current + 1
            : 1;

      }else{
        current = 1;
      }

      longest =
        Math.max(longest, current);

      prevDate = d;
    });

    var curStreak = 0;
    var cursor = new Date(today);

    var todayKey = dateKey(today);
    var todayEntry = entries[todayKey];

    var todayActive =
      todayEntry &&
      (
        todayEntry.note ||
        todayEntry.tasks.some(function(t){
          return t.done;
        })
      );

    if(!todayActive){
      cursor.setDate(
        cursor.getDate() - 1
      );
    }

    while(cursor >= start){

      var ck = dateKey(cursor);
      var ce = entries[ck];

      var active =
        ce &&
        (
          ce.note ||
          ce.tasks.some(function(t){
            return t.done;
          })
        );

      if(!active) break;

      curStreak++;

      cursor.setDate(
        cursor.getDate() - 1
      );
    }

    var missed = 0;
    var mCursor = new Date(start);

    while(mCursor < today){

      var mk = dateKey(mCursor);
      var me = entries[mk];

      var mActive =
        me &&
        (
          me.note ||
          me.tasks.some(function(t){
            return t.done;
          })
        );

      if(!mActive){
        missed++;
      }

      mCursor.setDate(
        mCursor.getDate() + 1
      );
    }

    var createdAt = start;

    var daysSinceCreation =
      Math.max(
        1,
        Math.round(
          (today - createdAt) /
          86400000
        ) + 1
      );

    var pct =
      Math.min(
        100,
        Math.round(
          (activeDays /
          daysSinceCreation) * 100
        )
      );

    document.getElementById(
      "stat-remaining"
    ).textContent = remaining;

    document.getElementById(
      "stat-active"
    ).textContent = activeDays;

    document.getElementById(
      "stat-tasks"
    ).textContent = totalDoneTasks;

    document.getElementById(
      "stat-streak"
    ).textContent = longest;

    document.getElementById(
      "stat-current-streak"
    ).textContent = curStreak;

    document.getElementById(
      "stat-missed"
    ).textContent = missed;

    document.getElementById(
      "progress-pct"
    ).textContent = pct + "%";

    var circle =
      document.getElementById(
        "progress-circle"
      );

    var circumference =
      2 * Math.PI * 42;

    circle.style.strokeDasharray =
      circumference;

    circle.style.strokeDashoffset =
      circumference -
      (pct / 100) * circumference;

    var chart =
      document.getElementById(
        "bar-chart"
      );

    chart.innerHTML = "";

    var last14 = [];

    for(var i = 13; i >= 0; i--){

      var dd = new Date(today);

      dd.setDate(
        dd.getDate() - i
      );

      last14.push(dd);
    }

    var maxTasks = 1;

    last14.forEach(function(dd){

      var e =
        entries[dateKey(dd)];

      if(e){

        maxTasks =
          Math.max(
            maxTasks,
            e.tasks.filter(function(t){
              return t.done;
            }).length
          );
      }
    });

    last14.forEach(function(dd){

      var e =
        entries[dateKey(dd)];

      var doneCount =
        e
          ? e.tasks.filter(function(t){
              return t.done;
            }).length
          : 0;

      var col =
        document.createElement("div");

      col.className =
        "bar-col" +
        (
          sameDay(dd, today)
            ? " today"
            : ""
        );

      var bar =
        document.createElement("div");

      bar.className = "bar";

      bar.style.height =
        (
          dd < start
            ? 0
            : Math.max(
                4,
                (doneCount / maxTasks) * 84
              )
        ) + "px";

      var lbl =
        document.createElement("div");

      lbl.className = "bar-day";
      lbl.textContent = dd.getDate();

      col.appendChild(bar);
      col.appendChild(lbl);

      chart.appendChild(col);
    });

    var subjBox =
      document.getElementById(
        "subject-stats"
      );

    subjBox.innerHTML = "";

    var subjTotals = {};

    Object.keys(entries).forEach(function(k){

      entries[k].tasks.forEach(function(t){

        if(!subjTotals[t.label]){
          subjTotals[t.label] = {
            assigned: 0,
            done: 0
          };
        }

        subjTotals[t.label].assigned++;

        if(t.done){
          subjTotals[t.label].done++;
        }
      });
    });

    var subjNames =
      Object.keys(subjTotals);

    if(!subjNames.length){

      subjBox.innerHTML =
        "<p style='color:var(--text-muted);font-size:13.5px;'>لا توجد بيانات كافية بعد — سجّل بضعة أيام لتظهر هنا.</p>";

    }else{

      subjNames.sort(function(a,b){
        return (
          subjTotals[b].done -
          subjTotals[a].done
        );
      });

      subjNames.forEach(function(name){

        var s =
          subjTotals[name];

        var p =
          s.assigned
            ? Math.round(
                (s.done /
                s.assigned) * 100
              )
            : 0;

        var row =
          document.createElement("div");

        row.className = "subj-row";

        row.innerHTML =
          '<div class="subj-top">' +
          '<span>' + name + '</span>' +
          '<span class="pct">' + p + '%</span>' +
          '</div>' +
          '<div class="subj-track">' +
          '<div class="subj-fill" style="width:' +
          p +
          '%"></div>' +
          '</div>';

        subjBox.appendChild(row);
      });
    }
  }

          state.profile.theme = {
            accent: p.accent,
            dim: p.dim,
            text: p.text
          };

          applyTheme(
            state.profile.theme
          );

          await saveProfile(
            state.profileKey,
            state.profile
          );

          renderSettings();
        }
      );

      swatchRow.appendChild(sw);
    });

    document.getElementById(
      "custom-color"
    ).value = theme.accent;

    document.getElementById(
      "in-school"
    ).value =
      state.profile.schoolName || "";

    document.getElementById(
      "bg-status"
    ).textContent =
      state.profile.bgImage
        ? "الخلفية الحالية: صورة شخصية مضبوطة."
        : "لا توجد خلفية شخصية حالياً.";

    var box =
      document.getElementById(
        "subjects-list"
      );

    box.innerHTML = "";

    state.profile.subjects.forEach(
      function(subj, idx){

        var row =
          document.createElement("div");

        row.className =
          "subject-row";

        var span =
          document.createElement("span");

        span.textContent = subj;

        var rm =
          document.createElement("button");

        rm.textContent = "حذف";

        rm.addEventListener(
          "click",
          async function(){

            state.profile.subjects.splice(
              idx,
              1
            );

            await saveProfile(
              state.profileKey,
              state.profile
            );

            renderSettings();
          }
        );

        row.appendChild(span);
        row.appendChild(rm);

        box.appendChild(row);
      }
    );
  }

  /* =========================
     EVENTS
  ========================= */

  document.getElementById(
    "btn-login"
  ).addEventListener(
    "click",
    handleLogin
  );

  document.getElementById(
    "in-pin"
  ).addEventListener(
    "keydown",
    function(e){
      if(e.key === "Enter"){
        handleLogin();
      }
    }
  );

  document.querySelectorAll(
    ".tab-btn"
  ).forEach(function(b){

    b.addEventListener(
      "click",
      function(){
        switchTab(
          b.dataset.tab
        );
      }
    );
  });

  document.getElementById(
    "btn-logout"
  ).addEventListener(
    "click",
    logout
  );

  document.getElementById(
    "btn-logout-2"
  ).addEventListener(
    "click",
    logout
  );

  document.getElementById(
    "date-prev"
  ).addEventListener(
    "click",
    function(){
      changeDay(-1);
    }
  );

  document.getElementById(
    "date-next"
  ).addEventListener(
    "click",
    function(){
      changeDay(1);
    }
  );

  document.getElementById(
    "btn-add-task"
  ).addEventListener(
    "click",
    function(){

      var input =
        document.getElementById(
          "new-task-input"
        );

      var val =
        input.value.trim();

      if(!val) return;

      state.currentEntry.tasks.push({
        id: uid(),
        label: val,
        done: false
      });

      input.value = "";

      renderTaskListOnly(
        state.currentEntry
      );

      scheduleSave();
    }
  );

  document.getElementById(
    "new-task-input"
  ).addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){
        document.getElementById(
          "btn-add-task"
        ).click();
      }
    }
  );

  document.getElementById(
    "btn-save-day"
  ).addEventListener(
    "click",
    saveCurrentDay
  );

  document.getElementById(
    "journal-text"
  ).addEventListener(
    "input",
    scheduleSave
  );

  document.getElementById(
    "btn-add-subject"
  ).addEventListener(
    "click",
    async function(){

      var input =
        document.getElementById(
          "new-subject-input"
        );

      var val =
        input.value.trim();

      if(!val) return;

      if(
        state.profile.subjects.some(
          function(s){
            return (
              s.trim().toLowerCase() ===
              val.toLowerCase()
            );
          }
        )
      ){
        input.value = "";
        return;
      }

      state.profile.subjects.push(val);

      if(state.currentEntry){

        state.currentEntry.tasks.push({
          id: uid(),
          label: val,
          done: false
        });
      }

      input.value = "";

      await persistNow();

      renderSettings();

      if(state.currentEntry){
        renderTaskListOnly(
          state.currentEntry
        );
      }
    }
  );

  document.getElementById(
    "new-subject-input"
  ).addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){
        document.getElementById(
          "btn-add-subject"
        ).click();
      }
    }
  );

  document.getElementById(
    "custom-color"
  ).addEventListener(
    "change",
    async function(e){

      var hex = e.target.value;

      var theme = {
        accent: hex,
        dim: darkenHex(hex, 60),
        text: textColorFor(hex)
      };

      state.profile.theme = theme;

      applyTheme(theme);

      await persistNow();

      renderSettings();
    }
  );

  document.getElementById(
    "in-school"
  ).addEventListener(
    "change",
    async function(e){

      state.profile.schoolName =
        e.target.value.trim();

      document.querySelector(
        "#screen-dashboard .who .sub"
      ).textContent =
        state.profile.schoolName ||
        "مسار البكالوريا 2027";

      await persistNow();
    }
  );

  document.getElementById(
    "bg-photo-input"
  ).addEventListener(
    "change",
    function(e){

      var file =
        e.target.files &&
        e.target.files[0];

      if(!file) return;

      var statusEl =
        document.getElementById(
          "bg-status"
        );

      statusEl.textContent =
        "جارٍ معالجة الصورة...";

      var reader =
        new FileReader();

      reader.onload =
        function(ev){

          var img = new Image();

          img.onload =
            async function(){

              var maxW = 900;

              var scale =
                Math.min(
                  1,
                  maxW / img.width
                );

              var canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                img.width * scale;

              canvas.height =
                img.height * scale;

              var ctx =
                canvas.getContext("2d");

              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );

              var dataUrl =
                canvas.toDataURL(
                  "image/jpeg",
                  0.6
                );

              state.profile.bgImage =
                dataUrl;

              applyBackground(
                dataUrl
              );

              var ok =
                await saveProfile(
                  state.profileKey,
                  state.profile
                );

              statusEl.textContent =
                ok
                  ? "تم ضبط الخلفية."
                  : "تعذّر حفظ الخلفية: " +
                    (
                      lastStorageError ||
                      "خطأ غير معروف"
                    );
            };

          img.src =
            ev.target.result;
        };

      reader.readAsDataURL(file);
    }
  );

  document.getElementById(
    "btn-remove-bg"
  ).addEventListener(
    "click",
    async function(){

      state.profile.bgImage = null;

      applyBackground(null);

      document.getElementById(
        "bg-photo-input"
      ).value = "";

      await persistNow();

      renderSettings();
    }
  );

  /* =========================
     INIT
  ========================= */

  updateCountdown();

  setInterval(
    updateCountdown,
    1000
  );

  refreshKnownUsers();

})();
</script>
</body>
</html>
