<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفيق البكالوريا 2027</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#12181d;
    --surface:#1b232a;
    --surface-2:#232d35;
    --border:#324049;
    --text:#eef1ee;
    --text-muted:#8fa0a8;
    --accent:#d7a63c;
    --accent-dim:#8a6a2a;
    --accent-text:#1a1305;
    --gold:var(--accent);
    --gold-dim:var(--accent-dim);
    --green:#4f9078;
    --green-dim:#2c4a3d;
    --red:#b1493f;
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:24px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
  }

  body{
    background:
      radial-gradient(
        circle at 1px 1px,
        rgba(215,166,60,.09) 1px,
        transparent 0
      ) 0 0/22px 22px,
      var(--bg);

    color:var(--text);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    line-height:1.6;
  }

  h1,h2,h3,.display{
    font-family:'Tajawal', sans-serif;
  }

  .hidden{
    display:none !important;
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }

  input,
  textarea{
    font-family:inherit;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:11px 14px;
    font-size:15px;
    width:100%;
  }

  input:focus,
  textarea:focus,
  button:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }

  .ticket{
    position:relative;
  }

  .ticket::before,
  .ticket::after{
    content:"";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--border);
  }

  .ticket::before{
    left:-10px;
  }

  .ticket::after{
    right:-10px;
  }

  .seal{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%) rotate(-6deg);
    width:74px;
    height:74px;
    border-radius:50%;
    border:2px dashed var(--gold-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--gold);
    font-family:'Tajawal',sans-serif;
  }

  .seal .yr{
    font-size:16px;
    font-weight:800;
    line-height:1;
  }

  .seal .lbl2{
    font-size:8.5px;
    color:var(--text-muted);
    margin-top:2px;
    letter-spacing:.5px;
  }

  @keyframes riseIn{
    from{
      opacity:0;
      transform:translateY(10px);
    }

    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  .rise-in{
    animation:riseIn .55s ease both;
  }

  /* ---------- LOGIN SCREEN ---------- */

  #screen-login{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
  }

  .brand{
    text-align:center;
    margin-bottom:28px;
  }

  .brand .kicker{
    color:var(--gold);
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
  }

  .brand h1{
    font-size:26px;
    font-weight:800;
    margin:0;
  }

  .countdown-hero{
    background:
      linear-gradient(
        160deg,
        var(--surface) 0%,
        var(--surface-2) 100%
      );

    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:34px 22px 30px;
    width:100%;
    max-width:420px;
    text-align:center;
    margin-bottom:34px;
    overflow:visible;
  }

  .countdown-hero .exam-date{
    color:var(--text-muted);
    font-size:14px;
    margin-bottom:14px;
  }

  .countdown-big{
    font-size:64px;
    font-weight:800;
    color:var(--gold);
    line-height:1;
    font-family:'Tajawal',sans-serif;
  }

  .countdown-big span{
    font-size:20px;
    font-weight:500;
    color:var(--text-muted);
    margin-right:6px;
  }

  .countdown-sub{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:18px;
    color:var(--text-muted);
    font-size:14px;
  }

  .countdown-sub b{
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:16px;
  }

  .login-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:26px;
    width:100%;
    max-width:420px;
  }

  .login-card h2{
    font-size:18px;
    margin:0 0 4px;
  }

  .login-card p.help{
    color:var(--text-muted);
    font-size:13.5px;
    margin:0 0 18px;
  }

  .field{
    margin-bottom:14px;
  }

  .field label{
    display:block;
    font-size:13.5px;
    color:var(--text-muted);
    margin-bottom:6px;
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:18px;
  }

  .btn{
    flex:1;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    font-size:15px;
    font-weight:600;
    transition:
      transform .12s ease,
      opacity .12s ease;
  }

  .btn:active{
    transform:scale(.97);
  }

  .btn-primary{
    background:var(--accent);
    color:var(--accent-text);
  }

  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }

  .btn-danger{
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
  }

  .login-msg{
    margin-top:12px;
    font-size:13.5px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    display:none;
  }

  .login-msg.show{
    display:block;
  }

  .login-msg.err{
    background:rgba(177,73,63,.15);
    color:#e4948c;
  }

  .login-msg.ok{
    background:rgba(79,144,120,.15);
    color:#8fd4bb;
  }

  .known-users{
    margin-top:18px;
  }

  .known-users .lbl{
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:8px;
  }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .chip{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-muted);
    padding:6px 12px;
    border-radius:100px;
    font-size:13px;
  }

  .privacy-note{
    max-width:420px;
    color:var(--text-muted);
    font-size:12.5px;
    text-align:center;
    margin-top:16px;
    padding:0 8px;
  }

  /* ---------- DASHBOARD ---------- */

  #screen-dashboard{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header.topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }

  .who{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--gold-dim);
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
  }

  .who .name{
    font-weight:700;
    font-size:15px;
  }

  .who .sub{
    font-size:12px;
    color:var(--text-muted);
  }

  .topbar-actions{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .mini-countdown{
    font-size:13px;
    color:var(--text-muted);
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:7px 12px;
    border-radius:100px;
  }

  .mini-countdown b{
    color:var(--gold);
    font-family:'Tajawal',sans-serif;
  }

  .logout-btn{
    color:var(--text-muted);
    background:transparent;
    font-size:13px;
    text-decoration:underline;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    padding:10px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
  }

  .tab-btn{
    background:transparent;
    color:var(--text-muted);
    padding:9px 16px;
    border-radius:100px;
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
  }

  .tab-btn.active{
    background:var(--accent);
    color:var(--accent-text);
  }

  main{
    flex:1;
    padding:22px 18px 60px;
    max-width:760px;
    margin:0 auto;
    width:100%;
  }

  .tab-panel h2{
    font-size:19px;
    margin:0 0 4px;
  }

  .panel-sub{
    color:var(--text-muted);
    font-size:13.5px;
    margin:0 0 20px;
  }

  /* today tab */

  .date-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:12px 16px;
    margin-bottom:18px;
  }

  .date-nav button{
    background:var(--surface-2);
    color:var(--text);
    width:34px;
    height:34px;
    border-radius:50%;
    font-size:16px;
  }

  .date-nav .date-label{
    text-align:center;
  }

  .date-nav .date-label .d1{
    font-weight:700;
    font-size:15px;
  }

  .date-nav .date-label .d2{
    font-size:12px;
    color:var(--text-muted);
  }

  .task-list{
    list-style:none;
    margin:0 0 14px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .task-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 14px;
  }

  .task-item.done{
    opacity:.55;
  }

  .task-item .check{
    width:22px;
    height:22px;
    border-radius:6px;
    border:2px solid var(--gold-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    color:transparent;
    font-size:14px;
  }

  .task-item.done .check{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }

  .task-item .label{
    flex:1;
    font-size:14.5px;
  }

  .task-item.done .label{
    text-decoration:line-through;
  }

  .task-item .remove{
    background:transparent;
    color:var(--text-muted);
    font-size:13px;
  }

  .add-task-row{
    display:flex;
    gap:8px;
    margin-bottom:22px;
  }

  .add-task-row input{
    flex:1;
  }

  .add-task-row button{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:0 16px;
    font-size:14px;
  }

  .journal-box textarea{
    min-height:110px;
    resize:vertical;
  }

  .save-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:16px;
  }

  .save-status{
    font-size:13px;
    color:var(--green);
    opacity:0;
    transition:opacity .3s;
  }

  .save-status.show{
    opacity:1;
  }

  /* calendar tab */

  .month-block{
    margin-bottom:26px;
  }

  .month-block h3{
    font-size:15.5px;
    margin:0 0 10px;
    font-weight:700;
  }

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }

  .cal-head{
    text-align:center;
    font-size:11px;
    color:var(--text-muted);
    padding-bottom:4px;
  }

  .cal-cell{
    aspect-ratio:1;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12.5px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-muted);
  }

  .cal-cell.empty{
    background:transparent;
    border-color:transparent;
  }

  .cal-cell.active-day{
    background:var(--green-dim);
    border-color:var(--green);
    color:#bfe9d7;
    cursor:pointer;
    font-weight:600;
  }

  .cal-cell.today{
    border-color:var(--gold);
    color:var(--gold);
    font-weight:700;
  }

  .cal-cell.future{
    cursor:pointer;
  }

  .cal-cell.missed{
    cursor:pointer;
    border-color:var(--red);
    color:#d99b93;
  }

  .cal-cell.exam-day{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:var(--accent-text);
      <!-- TODAY -->
      <section class="tab-panel" id="tab-today">
        <h2>يوميات المذاكرة</h2>
        <p class="panel-sub">اضبط مهامك ليوم واحد، ودوّن ما أنجزته فعلاً.</p>

        <div class="date-nav">
          <button id="date-prev">›</button>
          <div class="date-label">
            <div class="d1" id="date-d1">—</div>
            <div class="d2" id="date-d2">—</div>
          </div>
          <button id="date-next">‹</button>
        </div>

        <div id="nudge-banner" class="hidden" style="background:var(--surface-2); border:1px dashed var(--gold-dim); border-radius:var(--radius-sm); padding:10px 14px; font-size:13px; color:var(--text-muted); margin-bottom:16px;">
          لم تسجّل أي نشاط لليوم بعد — خصّص لو 10 دقائق الآن، أفضل من لا شيء.
        </div>

        <div id="daily-quote" style="font-size:13px; color:var(--accent); background:var(--surface); border-right:3px solid var(--accent); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:16px;"></div>

        <ul class="task-list" id="task-list"></ul>

        <div class="add-task-row">
          <input id="new-task-input" type="text" placeholder="أضف مهمة خاصة بهذا اليوم...">
          <button id="btn-add-task">إضافة</button>
        </div>

        <div class="journal-box">
          <label for="journal-text" style="display:block; font-size:13.5px; color:var(--text-muted); margin-bottom:8px;">
            ماذا فعلت في هذا اليوم؟
          </label>
          <textarea id="journal-text" placeholder="اكتب ملاحظاتك: ما الذي فهمته، ما الذي يحتاج مراجعة أكثر..."></textarea>
        </div>

        <div class="save-row">
          <button class="btn btn-primary" id="btn-save-day" style="flex:none; padding:12px 26px;">
            حفظ اليوم
          </button>
          <span class="save-status" id="save-status">تم الحفظ ✓</span>
        </div>
      </section>

      <!-- CALENDAR -->
      <section class="tab-panel hidden" id="tab-calendar">
        <h2>التقويم الدراسي</h2>
        <p class="panel-sub">
          الأيام الخضراء فيها نشاط مسجّل. اضغط على أي يوم للانتقال إليه.
        </p>
        <div id="calendar-container"></div>
      </section>

      <!-- STATS -->
      <section class="tab-panel hidden" id="tab-stats">
        <h2>إحصائيات التقدم</h2>
        <p class="panel-sub">
          نظرة سريعة على التزامك منذ بداية الاستعمال.
        </p>

        <div class="progress-wrap">
          <svg width="96" height="96" viewBox="0 0 96 96" class="progress-ring">
            <circle
              cx="48"
              cy="48"
              r="42"
              fill="none"
              stroke="#2a343c"
              stroke-width="10"
            />
            <circle
              id="progress-circle"
              cx="48"
              cy="48"
              r="42"
              fill="none"
              stroke="#d7a63c"
              stroke-width="10"
              stroke-linecap="round"
              transform="rotate(-90 48 48)"
            />
          </svg>

          <div class="progress-text">
            <div class="big" id="progress-pct">0%</div>
            <div class="small">
              نسبة الأيام التي باشرت فيها الاستعداد
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="num" id="stat-remaining">—</div>
            <div class="lbl">يوم متبقٍ للامتحان</div>
          </div>

          <div class="stat-card">
            <div class="num" id="stat-active">—</div>
            <div class="lbl">يوم فيه نشاط مسجّل</div>
          </div>

          <div class="stat-card">
            <div class="num" id="stat-tasks">—</div>
            <div class="lbl">مهمة أُنجزت إجمالاً</div>
          </div>

          <div class="stat-card">
            <div class="num" id="stat-streak">—</div>
            <div class="lbl">أطول سلسلة أيام متتالية</div>
          </div>

          <div class="stat-card">
            <div class="num" id="stat-current-streak">—</div>
            <div class="lbl">سلسلتك الحالية المستمرة</div>
          </div>

          <div class="stat-card">
            <div class="num" id="stat-missed">—</div>
            <div class="lbl">يوم فائت بلا نشاط</div>
          </div>
        </div>

        <div class="section-block">
          <h3 class="section-title">آخر 14 يوماً</h3>
          <div class="bar-chart" id="bar-chart"></div>
        </div>

        <div class="section-block">
          <h3 class="section-title">التزامك حسب المادة</h3>
          <div id="subject-stats"></div>
        </div>
      </section>

      <!-- SETTINGS -->
      <section class="tab-panel hidden" id="tab-settings">
        <h2>الإعدادات</h2>
        <p class="panel-sub">
          خصّص قائمة المواد التي تظهر تلقائياً كل يوم.
        </p>

        <div class="settings-block">
          <h3>مظهر الموقع</h3>
          <p class="panel-sub" style="margin-bottom:10px;">
            اختر لون التمييز الخاص بك.
          </p>

          <div class="swatch-row" id="swatch-row"></div>

          <div class="field" style="margin-top:10px;">
            <label>أو اختر لوناً مخصصاً</label>
            <input
              type="color"
              id="custom-color"
              value="#d7a63c"
              style="height:42px; padding:4px;"
            >
          </div>

          <p class="panel-sub" style="margin:18px 0 10px;">
            خلفية شخصية (صورة من هاتفك)
          </p>

          <div class="add-task-row">
            <input
              type="file"
              id="bg-photo-input"
              accept="image/*"
              style="flex:1;"
            >
            <button id="btn-remove-bg">إزالة</button>
          </div>

          <p class="panel-sub" id="bg-status" style="margin-top:8px;"></p>
        </div>

        <div class="settings-block">
          <h3>معلومات شخصية</h3>

          <div class="field">
            <label for="in-school">اسم الثانوية</label>
            <input
              type="text"
              id="in-school"
              placeholder="مثال: ثانوية ابن خلدون"
            >
          </div>
        </div>

        <div class="settings-block">
          <h3>المواد الافتراضية</h3>

          <div id="subjects-list"></div>

          <div class="add-task-row">
            <input
              id="new-subject-input"
              type="text"
              placeholder="أضف مادة جديدة..."
            >
            <button id="btn-add-subject">إضافة</button>
          </div>
        </div>

        <div class="settings-block">
          <h3>تذكير يومي</h3>

          <p class="panel-sub" style="margin-bottom:10px;">
            هذا الموقع نفسه لا يقدر يبعثلك تنبيهاً وأنت خارج منه — هذا قيد
            تقني في كل المواقع من هذا النوع، مش خاص بيه فقط. أفضل حل:
            اطلب من Claude في المحادثة أن يضبط لك منبّهاً حقيقياً على هاتفك
            في وقت ثابت كل يوم للمذاكرة.
          </p>
        </div>

        <div class="settings-block">
          <h3>الحساب</h3>

          <button class="btn btn-danger" id="btn-logout-2">
            تسجيل الخروج من هذا الحساب
          </button>
        </div>
      </section>
    </main>
  </div>

</div>

<script>
(function(){
  "use strict";

  var EXAM_DATE = new Date(2027, 5, 13, 8, 30, 0);

  function hashDateKey(k){
    var h = 0;

    for(var i=0; i<k.length; i++){
      h = ((h<<5)-h) + k.charCodeAt(i);
      h |= 0;
    }

    return Math.abs(h);
  }

  function darkenHex(hex, amount){
    var n = parseInt(hex.replace("#",""),16);

    var r = Math.max(
      0,
      ((n>>16)&255) - amount
    );

    var g = Math.max(
      0,
      ((n>>8)&255) - amount
    );

    var b = Math.max(
      0,
      (n&255) - amount
    );

    return "#" + [
      r,
      g,
      b
    ].map(function(v){
      return v.toString(16).padStart(2,"0");
    }).join("");
  }

  function textColorFor(hex){
    var n = parseInt(hex.replace("#",""),16);

    var r = (n>>16)&255;
    var g = (n>>8)&255;
    var b = n&255;

    var lum =
      (0.299*r) +
      (0.587*g) +
      (0.114*b);

    return lum > 150 ? "#1a1305" : "#ffffff";
  }

  function pad(n){
    return n < 10 ? "0"+n : ""+n;
  }

  function dateKey(d){
    return d.getFullYear() +
      "-" +
      pad(d.getMonth()+1) +
      "-" +
      pad(d.getDate());
  }

  function sameDay(a,b){
    return a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
  }

  // ---------- storage ----------
  // حفظ دائم: localStorage هو الأساس لأنه يبقى
  // بعد إغلاق الصفحة وإعادة فتحها.
  // نستخدم window.storage فقط كخيار احتياطي
  // داخل بيئات المعاينة التي توفره.

  var localStorageAvailable = false;

  var claudeStorageAvailable =
    !!(
      window.storage &&
      typeof window.storage.get === "function"
    );

  var lastStorageError = "";

  try{
    var __testKey = "__bac_storage_test__";

    window.localStorage.setItem(
      __testKey,
      "1"
    );

    window.localStorage.removeItem(
      __testKey
    );

    localStorageAvailable = true;
  }catch(e){}

  var persistenceAvailable =
    localStorageAvailable ||
    claudeStorageAvailable;

  var storageBackend =
    localStorageAvailable ?
    {
      get: async function(key){
        try{
          var value =
            window.localStorage.getItem(key);

          return value === null
            ? null
            : {
                key:key,
                value:value
              };
        }catch(e){
          lastStorageError =
            e && e.message
              ? e.message
              : String(e);

          return null;
        }
      },

      set: async function(key, value){
        try{
          window.localStorage.setItem(
            key,
            value
          );

          return {
            key:key,
            value:value
          };
        }catch(e){
          lastStorageError =
            e && e.message
              ? e.message
              : String(e);

          throw e;
        }
      }
    }
    :
    (
      claudeStorageAvailable
        ? window.storage
        : null
    );

      lastStorageError =
        e && e.message

          : String(e);

      return [];
    }
  }

  async function handleLogin(){
    var msgEl = document.getElementById("login-msg");

    var uname =
      document.getElementById("in-username").value.trim();

    var pin =
      document.getElementById("in-pin").value.trim();

    if(!uname){
      showMsg(
        msgEl,
        "أدخل اسم مستخدم أولاً.",
        "err"
      );
      return;
    }

    if(!/^[0-9]{4}$/.test(pin)){
      showMsg(
        msgEl,
        "رمز الدخول يجب أن يكون من 4 أرقام بالضبط.",
        "err"
      );
      return;
    }

    var keySafe = sanitizeKeyPart(uname);

    if(!keySafe){
      showMsg(
        msgEl,
        "الاسم يحتوي على رموز غير مدعومة، جرّب اسماً أبسط.",
        "err"
      );
      return;
    }

    var key =
      "bacuser_" +
      keySafe +
      "_" +
      pin;

    var existing =
      await loadProfile(key);

    if(existing){
      state.profile = existing;
      state.profileKey = key;
      enterDashboard();
      return;
    }

    var index =
      await loadIndex();

    var usernameTaken =
      index.some(function(u){
        return u.usernameSafe === keySafe;
      });

    if(usernameTaken){
      showMsg(
        msgEl,
        "اسم المستخدم موجود لكن رمز الدخول غير صحيح.",
        "err"
      );
      return;
    }

    var newProfile = {
      displayName: uname,
      createdAt: dateKey(todayMidnight()),
      subjects: DEFAULT_SUBJECTS.slice(),
      entries: {},
      theme: DEFAULT_THEME,
      bgImage: null,
      schoolName: ""
    };

    var created =
      await saveProfile(
        key,
        newProfile
      );

    if(!created){
      showMsg(
        msgEl,
        "تعذّر حفظ الحساب. جرّب مرة أخرى.",
        "err"
      );
      return;
    }

    index.push({
      usernameSafe: keySafe,
      displayName: uname
    });

    await saveIndex(index);

    state.profile = newProfile;
    state.profileKey = key;

    showMsg(
      msgEl,
      "تم إنشاء حسابك بنجاح.",
      "ok"
    );

    setTimeout(
      enterDashboard,
      400
    );
  }

  // ---------- countdown ----------
  function updateCountdown(){
    var now = new Date();
    var diff = EXAM_DATE - now;

    if(diff < 0) diff = 0;

    var days =
      Math.floor(diff / 86400000);

    var hours =
      Math.floor(
        (diff % 86400000) /
        3600000
      );

    var mins =
      Math.floor(
        (diff % 3600000) /
        60000
      );

    var secs =
      Math.floor(
        (diff % 60000) /
        1000
      );

    var cdDays =
      document.getElementById("cd-days");

    if(cdDays){
      cdDays.innerHTML =
        days +
        "<span>يوم</span>";
    }

    var ch =
      document.getElementById("cd-hours");

    if(ch) ch.textContent = pad(hours);

    var cm =
      document.getElementById("cd-mins");

    if(cm) cm.textContent = pad(mins);

    var cs =
      document.getElementById("cd-secs");

    if(cs) cs.textContent = pad(secs);

    var md =
      document.getElementById("mini-days");

    if(md) md.textContent = days;
  }

  function getEntry(dKey){
    var e =
      state.profile.entries[dKey];

    if(!e){
      e = {
        tasks:
          state.profile.subjects.map(
            function(s){
              return {
                id:uid(),
                label:s,
                done:false
              };
            }

      state.selectedDate.getDate() +

    document.getElementById("date-d2")

  function accountStartMidnight(){

  function changeDay(delta){
    var d =
      new Date(
        state.selectedDate
      );

    d.setDate(
      d.getDate() + delta
    );

    var start =
      accountStartMidnight();

    var exam =
      new Date(EXAM_DATE);

    exam.setHours(0,0,0,0);

    if(d < start || d > exam){
      return;
    }

    state.selectedDate = d;

    renderToday();
  }

  // ---------- calendar ----------
  function renderCalendar(){
    var container =
      document.getElementById(
        "calendar-container"
      );

    container.innerHTML = "";

    var start =
      accountStartMidnight();

    var end =
      new Date(EXAM_DATE);

    end.setHours(0,0,0,0);

    var cursor =
      new Date(start);

    var months = {};

    while(cursor <= end){
      var key =
        cursor.getFullYear() +
        "-" +
        cursor.getMonth();

      if(!months[key]){
        months[key] = [];
      }

      months[key].push(
        new Date(cursor)
      );

      cursor.setDate(
        cursor.getDate() + 1
      );
    }

    Object.keys(months).forEach(
      function(key){
        var days = months[key];

        var first = days[0];

        var block =
          document.createElement("div");

        block.className =
          "calendar-month";

        var title =
          document.createElement("h3");

        title.textContent =
          MONTHS[first.getMonth()] +
          " " +
          first.getFullYear();

        block.appendChild(title);

        var grid =
          document.createElement("div");

        grid.className =
          "calendar-grid";

        WEEKDAYS.forEach(
          function(w){
            var head =
              document.createElement("div");

            head.className =
              "calendar-weekday";

            head.textContent = w;

            grid.appendChild(head);
          }
        );

        var firstDay =
          first.getDay();

        for(
          var empty=0;
          empty<firstDay;
          empty++
        ){
          var spacer =
            document.createElement("div");

          spacer.className =
            "calendar-day empty";

          grid.appendChild(spacer);
        }

        days.forEach(
          function(day){
            var dKey =
              dateKey(day);

            var entry =
              state.profile.entries[dKey];

            var active =
              entry &&
              (
                entry.note ||
                entry.tasks.some(
                  function(t){
                    return t.done;
                  }
                )
              );

            var cell =
              document.createElement("button");

            cell.className =
              "calendar-day" +
              (active ? " active" : "") +
              (
                sameDay(
                  day,
                  todayMidnight()
                )
                  ? " today"
                  : ""
              );

            cell.textContent =
              day.getDate();

            cell.addEventListener(
              "click",
              function(){
                state.selectedDate =
                  new Date(day);

                switchTab("today");
              }
            );

            grid.appendChild(cell);
          }
        );

        block.appendChild(grid);
        container.appendChild(block);
      }
    );
  }

  // ---------- statistics ----------
  function renderStats(){
    var entries =
      state.profile.entries;

    var today =
      todayMidnight();

    var start =
      accountStartMidnight();

    var remaining =
      Math.max(
        0,
        Math.ceil(
          (EXAM_DATE - new Date()) /
          86400000
        )
      );

    var activeDays = 0;
    var totalDoneTasks = 0;

    Object.keys(entries).forEach(
      function(k){
        var e = entries[k];

        if(
          e.note ||
          e.tasks.some(
            function(t){
              return t.done;
            }
          )
        ){
          activeDays++;
        }

        totalDoneTasks +=
          e.tasks.filter(
            function(t){
              return t.done;
            }
          ).length;
      }
    );

    var longest = 0;
    var cur = 0;

    var cursor =
      new Date(start);

    while(cursor <= today){
      var ck =
        dateKey(cursor);

      var ce =
        entries[ck];

      var active =
        ce &&
        (
          ce.note ||
          ce.tasks.some(
            function(t){
              return t.done;
            }
          )
        );

      if(active){
        cur++;
        longest =
          Math.max(
            longest,
            cur
          );
      }else{
        cur = 0;
      }

      cursor.setDate(
        cursor.getDate() + 1
      );
    }

    var curStreak = 0;

    var cursor2 =
      new Date(today);

    var todayEntry =
      entries[
        dateKey(cursor2)
      ];

    var todayActive =
      todayEntry &&
      (
        todayEntry.note ||
        todayEntry.tasks.some(
          function(t){
            return t.done;
          }
        )
      );

    if(!todayActive){
      cursor2.setDate(
        cursor2.getDate() - 1
      );
    }

    while(cursor2 >= start){
      var ck2 =
        dateKey(cursor2);

      var ce2 =
        entries[ck2];

      var active2 =
        ce2 &&
        (
          ce2.note ||
          ce2.tasks.some(
            function(t){
              return t.done;
            }
          )
        );

      if(!active2){
        break;
      }

      curStreak++;

      cursor2.setDate(
        cursor2.getDate() - 1
      );
    }

    var missed = 0;

    var mCursor =
      new Date(start);

    while(mCursor < today){
      var mk =
        dateKey(mCursor);

      var me =
        entries[mk];

      var mActive =
        me &&
        (
          me.note ||
          me.tasks.some(
            function(t){
              return t.done;
            }
          )
        );

      if(!mActive){
        missed++;
      }

      mCursor.setDate(
        mCursor.getDate() + 1
      );
    }

    var daysSinceCreation =
      Math.max(
        1,
        Math.round(
          (today - start) /
          86400000
        ) + 1
      );

    var pct =
      Math.min(
        100,
        Math.round(
          (activeDays /
          daysSinceCreation) *
          100
        )
      );

    document.getElementById(
      "stat-remaining"
    ).textContent = remaining;

    document.getElementById(
      "stat-active"
    ).textContent = activeDays;

    document.getElementById(
      "stat-tasks"
    ).textContent = totalDoneTasks;

    document.getElementById(
      "stat-streak"
    ).textContent = longest;

    document.getElementById(
      "stat-current-streak"
    ).textContent = curStreak;

    document.getElementById(
      "stat-missed"
    ).textContent = missed;

    document.getElementById(
      "progress-pct"
    ).textContent =
      pct + "%";

    var circle =
      document.getElementById(
        "progress-circle"
      );

    var circumference =
      2 * Math.PI * 42;

    circle.style.strokeDasharray =
      circumference;

    circle.style.strokeDashoffset =
      circumference -
      (pct / 100) *
      circumference;

    // 14-day chart
    var chart =
      document.getElementById(
        "bar-chart"
      );

    chart.innerHTML = "";

    var last14 = [];

    for(
      var i=13;
      i>=0;
      i--
    ){
      var dd =
        new Date(today);

      dd.setDate(
        dd.getDate() - i
      );

      last14.push(dd);
    }

    var maxTasks = 1;

    last14.forEach(
      function(dd){
        var e =
          entries[dateKey(dd)];

        if(e){
          maxTasks =
            Math.max(
              maxTasks,
              e.tasks.filter(
                function(t){
                  return t.done;
                }
              ).length
            );
        }
      }
    );

    last14.forEach(
      function(dd){
        var e =
          entries[dateKey(dd)];

        var doneCount =
          e
            ? e.tasks.filter(
                function(t){
                  return t.done;
                }
              ).length
            : 0;

        var col =
          document.createElement("div");

        col.className =
          "bar-col" +
          (
            sameDay(dd,today)
              ? " today"
              : ""
          );

        var bar =
          document.createElement("div");

        bar.className = "bar";

        bar.style.height =
          (
            dd < start
              ? 0
              : Math.max(
                  4,
                  (doneCount /
                  maxTasks) *
                  84
                )
          ) + "px";

        var lbl =
          document.createElement("div");

        lbl.className =
          "bar-day";

        lbl.textContent =
          dd.getDate();

        col.appendChild(bar);
        col.appendChild(lbl);

        chart.appendChild(col);
      }
    );

    // subject statistics
    var subjBox =
      document.getElementById(
        "subject-stats"
      );

    subjBox.innerHTML = "";

    var subjTotals = {};

    Object.keys(entries).forEach(
      function(k){
        entries[k].tasks.forEach(
          function(t){
            if(!subjTotals[t.label]){
              subjTotals[t.label] = {
                assigned:0,
                done:0
              };
            }

            subjTotals[t.label]
              .assigned++;

            if(t.done){
              subjTotals[t.label]
                .done++;
            }
          }
        );
      }
    );

    var subjNames =
      Object.keys(subjTotals);

    if(!subjNames.length){
      subjBox.innerHTML =
        "<p style='color:var(--text-muted);font-size:13.5px;'>لا توجد بيانات كافية بعد — سجّل بضعة أيام لتظهر هنا.</p>";
    }else{
      subjNames.sort(
        function(a,b){
          return
            subjTotals[b].done -
            subjTotals[a].done;
        }
      );

      subjNames.forEach(
        function(name){
          var s =
            subjTotals[name];

          var p =
            s.assigned
              ? Math.round(
                  (s.done /
                  s.assigned) *
                  100
                )
              : 0;

          var row =
            document.createElement("div");

          row.className =
            "subj-row";

          row.innerHTML =
            '<div class="subj-top">' +
              '<span>'+name+'</span>' +
              '<span class="pct">'+p+'%</span>' +
            '</div>' +
            '<div class="subj-track">' +
              '<div class="subj-fill" style="width:'+p+'%"></div>' +
            '</div>';

          subjBox.appendChild(row);
        }
      );
    }
  }

  // ---------- settings ----------
  function renderSettings(){
    var theme =
      state.profile.theme ||
      DEFAULT_THEME;

    var swatchRow =
      document.getElementById(
        "swatch-row"
      );

    swatchRow.innerHTML = "";

    ACCENT_PRESETS.forEach(
      function(p){
        var sw =
          document.createElement("div");

        sw.className =
          "swatch" +
          (
            theme.accent === p.accent
              ? " selected"
              : ""
          );

        sw.style.background =
          p.accent;

        sw.title = p.name;

        sw.addEventListener(
          "click",
          async function(){
            state.profile.theme = {
              accent:p.accent,
              dim:p.dim,
              text:p.text
            };

            applyTheme(
              state.profile.theme
            );

            await persistNow();

            renderSettings();
          }
        );

        swatchRow.appendChild(sw);
      }
    );

    document.getElementById(
      "custom-color"
    ).value = theme.accent;

    document.getElementById(
      "in-school"
    ).value =
      state.profile.schoolName || "";

    document.getElementById(
      "bg-status"
    ).textContent =
      state.profile.bgImage
        ? "الخلفية الحالية: صورة شخصية مضبوطة."
        : "لا توجد خلفية شخصية حالياً.";

    var box =
      document.getElementById(
        "subjects-list"
      );

    box.innerHTML = "";

    state.profile.subjects.forEach(
      function(subj,idx){
        var row =
          document.createElement("div");

        row.className =
          "subject-row";

        var span =
          document.createElement("span");

        span.textContent = subj;

        var rm =
          document.createElement("button");

        rm.textContent = "حذف";

        rm.addEventListener(
          "click",
          async function(){
            state.profile.subjects
              .splice(idx,1);

            await persistNow();

            renderSettings();
          }
        );

        row.appendChild(span);
        row.appendChild(rm);

        box.appendChild(row);
      }
    );
  }

  // ---------- wiring ----------
  document.getElementById(
    "btn-login"
  ).addEventListener(
    "click",
    handleLogin
  );

  document.getElementById(
    "in-pin"
  ).addEventListener(
    "keydown",
    function(e){
      if(e.key === "Enter"){
        handleLogin();
      }
    }
  );

  document
    .querySelectorAll(".tab-btn")
    .forEach(
      function(b){
        b.addEventListener(
          "click",
          function(){
            switchTab(
              b.dataset.tab
            );
          }
        );
      }
    );

  document.getElementById(
    "btn-logout"
  ).addEventListener(
    "click",
    logout
  );

  document.getElementById(
    "btn-logout-2"
  ).addEventListener(
    "click",
    logout
  );

  document.getElementById(
    "date-prev"
  ).addEventListener(
    "click",
    function(){
      changeDay(-1);
    }
  );

  document.getElementById(
    "date-next"
  ).addEventListener(
    "click",
    function(){
      changeDay(1);
    }
  );

  document.getElementById(
    "btn-add-task"
  ).addEventListener(
    "click",
    function(){
      var input =
        document.getElementById(
          "new-task-input"
        );

      var val =
        input.value.trim();

      if(!val) return;

      state.currentEntry.tasks.push({
        id:uid(),
        label:val,
        done:false
      });

      input.value = "";

      renderTaskListOnly(
        state.currentEntry
      );

      scheduleSave();
    }
  );

  document.getElementById(
    "new-task-input"
  ).addEventListener(
    "keydown",
    function(e){
      if(e.key === "Enter"){
        document
          .getElementById(
            "btn-add-task"
          )
          .click();
      }
    }
  );

  document.getElementById(
    "btn-save-day"
  ).addEventListener(
    "click",
    saveCurrentDay
  );

  document.getElementById(
    "journal-text"
  ).addEventListener(
    "input",
    scheduleSave
  );

  document.getElementById(
    "btn-add-subject"
  ).addEventListener(
    "click",
    async function(){
      var input =
        document.getElementById(
          "new-subject-input"
        );

      var val =
        input.value.trim();

      if(!val) return;

      if(
        state.profile.subjects.some(
          function(s){
            return
              s.trim().toLowerCase() ===
              val.toLowerCase();
          }
        )
      ){
        input.value = "";
        return;
      }

      state.profile.subjects.push(val);

      if(state.currentEntry){
        state.currentEntry.tasks.push({
          id:uid(),
          label:val,
          done:false
        });
      }

      input.value = "";

      await persistNow();

      renderSettings();

      if(state.currentEntry){
        renderTaskListOnly(
          state.currentEntry
        );
      }
    }
  );

  document.getElementById(
    "new-subject-input"
  ).addEventListener(
    "keydown",
    function(e){
      if(e.key === "Enter"){
        document
          .getElementById(
            "btn-add-subject"
          )
          .click();
      }
    }
  );

  document.getElementById(
    "custom-color"
  ).addEventListener(
    "change",
    async function(e){
      var hex =
        e.target.value;

      var theme = {
        accent:hex,
        dim:darkenHex(hex,60),
        text:textColorFor(hex)
      };

      state.profile.theme =
        theme;

      applyTheme(theme);

      await persistNow();

      renderSettings();
    }
  );

  document.getElementById(
    "in-school"
  ).addEventListener(
    "change",
    async function(e){
      state.profile.schoolName =
        e.target.value.trim();

      document
        .querySelector(
          "#screen-dashboard .who .sub"
        )
        .textContent =
        state.profile.schoolName ||
        "مسار البكالوريا 2027";

      await persistNow();
    }
  );

  document.getElementById(
    "bg-photo-input"
  ).addEventListener(
    "change",
    function(e){
      var file =
        e.target.files &&
        e.target.files[0];

      if(!file) return;

      var statusEl =
        document.getElementById(
          "bg-status"
        );

      statusEl.textContent =
        "جارٍ معالجة الصورة...";

      var reader =
        new FileReader();

      reader.onload =
        function(ev){
          var img =
            new Image();

          img.onload =
            async function(){
              var maxW = 900;

              var scale =
                Math.min(
                  1,
                  maxW / img.width
                );

              var canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                img.width * scale;

              canvas.height =
                img.height * scale;

              var ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );

              var dataUrl =
                canvas.toDataURL(
                  "image/jpeg",
                  0.6
                );

              state.profile.bgImage =
                dataUrl;

              applyBackground(
                dataUrl
              );

              var ok =
                await saveProfile(
                  state.profileKey,
                  state.profile
                );

              statusEl.textContent =
                ok
                  ? "تم ضبط الخلفية."
                  : "تعذّر حفظ الخلفية: " +
                    (
                      lastStorageError ||
                      "خطأ غير معروف"
                    );
            };

          img.src =
            ev.target.result;
        };

      reader.readAsDataURL(file);
    }
  );

  document.getElementById(
    "btn-remove-bg"
  ).addEventListener(
    "click",
    async function(){
      state.profile.bgImage = null;

      applyBackground(null);

      document.getElementById(
        "bg-photo-input"
      ).value = "";

      await persistNow();

      renderSettings();
    }
  );

  // ---------- init ----------
  updateCountdown();

  setInterval(
    updateCountdown,
    1000
  );

  refreshKnownUsers();

})();
</script>

</body>
